# Render blueprint for Taz4Tech.
#
# Committed so the infrastructure is reviewable in a PR like any other change.
# No secret appears here: MONGODB_URI is marked sync:false, which makes Render
# prompt for it in the dashboard instead of reading it from this file.
#
# Frankfurt is the closest region Render offers to Lebanon; Atlas should be
# created in the same region so a query does not cross a continent per request.
#
# Cost at launch: one Starter web service ($7) + Atlas Flex (~$8) = about $15/mo.
# Free is not an option here — a free instance sleeps after 15 minutes and cold
# starts in roughly 60 seconds, which loses the order rather than delaying it.

services:
  - type: web
    name: taz4tech
    runtime: node
    plan: starter
    region: frankfurt
    branch: develop
    autoDeploy: true

    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false          # entered in the dashboard; never in git
      - key: MONGODB_DB
        value: taz4tech
      - key: STORE_ID
        value: taz4tech
      - key: SITE_URL
        value: https://taz4tech.com
      - key: LOG_LEVEL
        value: info

      # Admin area. BOTH or NEITHER — set only one and the app refuses to boot,
      # deliberately, rather than running a signer with no secret or ignoring a
      # password the operator believes is protecting the site.
      #
      # Left blank, /admin is a 404 and there is no admin area. That is the right
      # state for the first deploy: the storefront goes live before there is any
      # write surface exposed to the internet at all.
      #
      # Generated rather than typed:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      # Rotating the secret signs every open session out, which is how access is
      # revoked without a session table.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false

      # The importer is finished, but the screen that writes to the catalogue
      # stays behind a switch that can be turned off without a deploy.
      - key: TAZ_FLAG_EXCEL_IMPORTER
        value: "on"

    # Every PR gets a disposable copy of the app. This is the eleventh required
    # check in the quality gate — the one a human actually looks at.
    previews:
      generation: automatic
